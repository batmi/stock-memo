{% extends 'security_base.html' %}
{% block title %}새 비밀번호 설정{% endblock %}
{% block content %}
<h1>새 비밀번호 설정</h1>
<p>임시 비밀번호로 로그인했습니다. 기록을 열기 전에 본인만 아는 새 비밀번호를 설정해주세요.</p>
<form id="changeRequiredForm">
    <label>임시 비밀번호<input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>새 비밀번호<input type="password" name="new_password" autocomplete="new-password" minlength="8" maxlength="256" required></label>
    <label>새 비밀번호 확인<input type="password" name="confirm_password" autocomplete="new-password" required></label>
    <p>8자 이상, 영문·숫자·기호 중 두 종류 이상을 사용해주세요.</p>
    <p id="message" role="alert"></p>
    <button type="submit">비밀번호 설정</button>
</form>
<form method="post" action="{{ url_for('auth.logout', user_id=session.get('user_id')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit">로그아웃</button>
</form>
<script>
document.getElementById('changeRequiredForm').addEventListener('submit', async function(event) {
    event.preventDefault();
    const values = new FormData(this);
    const message = document.getElementById('message');
    if (values.get('new_password') !== values.get('confirm_password')) {
        message.textContent = '새 비밀번호가 일치하지 않습니다.';
        return;
    }
    const button = this.querySelector('button');
    button.disabled = true;
    message.textContent = '';
    try {
        const response = await fetch('/api/change_password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': {{ csrf_token() | tojson }},
                       'X-Journal-User-ID': {{ session.get('user_id') | string | tojson }} },
            body: JSON.stringify({ current_password: values.get('current_password'), new_password: values.get('new_password') })
        });
        const data = await response.json();
        if (response.ok || response.status === 409) window.location.replace('/');
        else if (response.status === 401) window.location.replace('/login');
        else message.textContent = data.error || '비밀번호 설정에 실패했습니다.';
    } catch (_) { message.textContent = '연결을 확인한 후 다시 시도해주세요.'; }
    finally { button.disabled = false; }
});
</script>
{% endblock %}
