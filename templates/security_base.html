<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · TRADING JOURNAL</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        main { width: min(340px, calc(100vw - 64px)); padding: 24px; background: #1e1e1e; border: 1px solid #333; border-radius: 16px; }
        h1 { font-size: 20px; } p { font-size: 14px; line-height: 1.6; }
        label { display: block; margin-top: 16px; font-size: 14px; }
        input, button { box-sizing: border-box; width: 100%; padding: 12px; border-radius: 8px; font: inherit; }
        input { margin-top: 6px; color: #fff; background: #121212; border: 1px solid #555; }
        button { margin-top: 20px; cursor: pointer; border: 0; background: #8a2be2; color: #fff; }
        button:disabled { opacity: .6; } a { color: #c5a0ff; } #message { color: #ff9999; }
    </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
